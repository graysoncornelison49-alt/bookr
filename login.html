<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookr — Seller Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#FF6B6B;--accent-dim:rgba(255,107,107,0.12);
  --bg:#080706;--surface:#111008;--surface2:#1a1810;
  --border:rgba(255,255,255,0.06);--border-med:rgba(255,255,255,0.13);
  --text:#f5f2ee;--muted:#908c86;--muted2:#3a3830;
  --danger:#e04444;--success:#3db87a;
  --font-display:'Fraunces',serif;--font-body:'Plus Jakarta Sans',sans-serif;
  --radius:14px;--radius-sm:9px;--pill:100px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
.login-card{background:var(--surface);border:1px solid var(--border-med);border-radius:20px;width:100%;max-width:420px;padding:2.5rem;box-shadow:0 40px 100px rgba(0,0,0,.6);}
.login-logo{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:1.2rem;font-weight:800;color:var(--text);margin-bottom:2rem;}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:flicker 2.4s ease-in-out infinite;}
@keyframes flicker{0%,100%{opacity:1;box-shadow:0 0 8px var(--accent);}40%{opacity:.5;box-shadow:0 0 3px var(--accent);}60%{opacity:1;box-shadow:0 0 14px #ffb347;}80%{opacity:.8;box-shadow:0 0 5px var(--accent);}}
.login-title{font-family:var(--font-display);font-size:1.75rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.4rem;}
.login-sub{font-size:13px;color:var(--muted);font-weight:300;margin-bottom:2rem;}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem;}
.form-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.form-input{background:var(--surface2);border:1px solid var(--border-med);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:14px;font-family:var(--font-body);outline:none;transition:border-color .15s;width:100%;}
.form-input::placeholder{color:var(--muted2);}
.form-input:focus{border-color:var(--accent);}
.form-input.error{border-color:var(--danger);}
.login-btn{width:100%;background:var(--accent);color:#fff;font-family:var(--font-display);font-size:14px;font-weight:800;padding:14px;border-radius:var(--pill);cursor:pointer;border:none;transition:opacity .15s;margin-top:.5rem;display:flex;align-items:center;justify-content:center;gap:8px;}
.login-btn:hover{opacity:.85;}
.login-btn:disabled{opacity:.5;cursor:default;}
.error-msg{font-size:12px;color:var(--danger);text-align:center;margin-top:.75rem;min-height:18px;}
.login-footer{font-size:11px;color:var(--muted);text-align:center;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border);}
.login-footer a{color:var(--accent);text-decoration:none;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo"><div class="logo-dot"></div>Bookr</div>
  <div class="login-title">Seller login</div>
  <div class="login-sub">Sign in to manage your events and sales.</div>
  <div class="form-group">
    <label class="form-label">Email</label>
    <input class="form-input" type="email" id="email" placeholder="you@email.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label class="form-label">Password</label>
    <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  </div>
  <button class="login-btn" id="loginBtn" onclick="login()">
    <div class="spinner" id="spinner"></div>
    Sign in
  </button>
  <div class="error-msg" id="errorMsg"></div>
  <div class="login-footer">
    <a href="index.html">← Back to Bookr</a>
  </div>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = window.BRAND.supabaseUrl;
const SUPABASE_KEY = window.BRAND.supabaseAnonKey;
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);
db.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = 'dashboard.html';
});
async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const spinner = document.getElementById('spinner');
  const errorMsg = document.getElementById('errorMsg');
  if (!email || !password) { errorMsg.textContent = 'Please enter your email and password.'; return; }
  btn.disabled = true;
  spinner.style.display = 'block';
  errorMsg.textContent = '';
  const { error } = await db.auth.signInWithPassword({ email, password });
  if (error) {
    errorMsg.textContent = 'Incorrect email or password.';
    btn.disabled = false;
    spinner.style.display = 'none';
    document.getElementById('password').classList.add('error');
    setTimeout(() => document.getElementById('password').classList.remove('error'), 1500);
  } else {
    window.location.href = 'dashboard.html';
  }
}
</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const B = window.BRAND; if (!B) return;
  document.documentElement.style.setProperty('--accent', B.accentColor);
  document.documentElement.style.setProperty('--accent-soft', B.accentColor + '24');
  document.documentElement.style.setProperty('--accent-glow', B.accentColor + '59');
  const html = document.body.innerHTML;
  document.body.innerHTML = html
    .replaceAll('{{BRAND_NAME}}', B.name)
    .replaceAll('{{ORGANIZER_NAME_UPPER}}', (B.organizerName||'').toUpperCase())
    .replaceAll('{{ORGANIZER_NAME}}', B.organizerName||'')
    .replaceAll('{{ORGANIZER_INITIALS}}', B.organizerInitials||'')
    .replaceAll('{{LEGAL_NAME}}', B.legalName||'')
    .replaceAll('{{LOCATION}}', B.location||'')
    .replaceAll('{{TAGLINE}}', B.tagline||'');
  document.title = document.title.replaceAll('{{BRAND_NAME}}', B.name);
});
</script>
</body>
</html>
